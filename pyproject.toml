[project]
name = "pipeline-copilot"
version = "0.1.0"
description = "AI on-call assistant that diagnoses data pipeline failures"
authors = [
    { email = "mahendramahato33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pipeline-copilot = "pipeline_copilot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
