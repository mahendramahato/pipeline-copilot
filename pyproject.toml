[project]
name = "pipeline-copilot"
version = "0.1.0"
description = "AI on-call assistant that diagnoses data pipeline failures"
authors = [
    { email = "mahendramahato33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.108",
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=1.30.0",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pipeline-copilot = "pipeline_copilot.cli:main"
pipeline-copilot-api = "pipeline_copilot.api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=1.5.6",
    "pytest>=9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# E9 = syntax errors, F = real bugs (undefined names, unused imports, ...).
# Style rules are left off on purpose: the goal is catching mistakes.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# project root on the path, so tests can import the evals/ harness
pythonpath = ["."]
